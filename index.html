  html += '</div>';
  return html;
}

function renderFeed(){
  if (!DB.threads.length){
    return '<div class="rb-card" style="padding:40px;text-align:center;">' +
      '<div class="rb-h" style="font-size:18px;margin-bottom:8px;">The board is empty</div>' +
      '<div style="color:var(--slate);font-size:14px;margin-bottom:16px;">' + (canViewSettings() ? 'Load the class and open the first wave from Settings.' : 'The class has not been opened yet.') + '</div>' +
      (canViewSettings() ? '<button class="rb-btn rb-btn-gold" data-nav="setup">Settings</button>' : '') +
    '</div>';
  }
  if (!recruitingStageConfig().usesWaves && DB.threads.length === 1){
    return renderThreadProspectList(DB.threads[0]);
  }
  let html = '<input class="rb-input" id="rb-board-search" placeholder="search recruits by name, rank or hometown" style="margin-bottom:14px;" />';
  html += '<div id="rb-board-cards" class="rb-board-list">';
  DB.threads.forEach(function(t){
    const visibleIds = visibleBoardProspectIds(t);
    const offerCount = visibleIds.reduce(function(sum, pid){ return sum + ((DB.offersByProspect[pid] || []).length); }, 0);
    const offerLabel = offerCount + ' offer' + (offerCount === 1 ? '' : 's') + ' on record';
    const uncommittedCount = t.prospectIds.reduce(function(sum, pid){
      const p = DB.prospects[pid];
      return sum + (p && !p.commitTeam ? 1 : 0);
    }, 0);
    const uncommittedLabel = uncommittedStatusLabel(uncommittedCount);
    const threadSearch = visibleIds.map(function(pid){
      const p = DB.prospects[pid] || {};
      return [p.rank, '#' + p.rank, p.name, p.hometown].join(' ');
    }).join(' ').toLowerCase();
    html += '<div class="rb-card rb-board-tile" data-board-card="1" data-search="' + escapeHtml(threadSearch) + '" data-open-thread="' + t.id + '">' +
      '<div class="rb-board-tile-inner">' +
        '<div style="min-width:0;">' +
          '<div class="rb-h rb-board-title">' + escapeHtml(t.title) + '</div>' +
          '<div class="rb-board-meta">' + rankRangeForThread(t) + ' &middot; ' + uncommittedLabel + ' &middot; ' + offerLabel + '</div>' +
        '</div>' +
        '<div class="rb-board-stars">' + starsOrLabel(t.stars) + '</div>' +
      '</div>' +
    '</div>';
	  });
  html += '</div>';
  html += '<div id="rb-board-player-results" style="display:none;flex-direction:column;gap:10px;">';
  DB.threads.forEach(function(t){
    visibleBoardProspectIds(t).forEach(function(pid){
      const p = DB.prospects[pid] || {};
      const searchText = [p.rank, '#' + p.rank, p.name, p.hometown].join(' ').toLowerCase();
      html += renderProspectBoardCard(pid, searchText);
    });
  });
  html += '</div>';
  return html;
}

function renderThreadProspectList(t){
  if (!t) return '<div style="color:var(--slate);">Thread not found.</div>';
  const filterKey = positionFilterKey('board', t.id);
  let html = '<div class="rb-h" style="font-size:20px;margin-bottom:4px;">' + escapeHtml(t.title) + '</div>';
  html += '<div style="font-size:13px;color:var(--slate);margin-bottom:18px;">' + rankRangeForThread(t) + ' on the board. Offers from every team stay visible here.</div>';
  html += '<div class="rb-card" style="padding:14px 16px;margin-bottom:14px;">';
  const visibleIds = visibleBoardProspectIds(t);
  html += renderPositionCounts(visibleIds, function(pid){ return DB.prospects[pid] && DB.prospects[pid].position; }, filterKey);
  html += '<input class="rb-input" data-thread-search="' + t.id + '" placeholder="search recruits by name, rank or hometown" />';
  const commitFilter = UI.boardCommitFilter || (UI.hideCommittedBoards ? 'uncommitted' : 'all');
  html += '<div class="rb-filter-row"><div class="rb-segmented" aria-label="Commit status filter">';
  [['committed','Committed'], ['all','All'], ['uncommitted','Uncommitted']].forEach(function(option){
    html += '<button type="button" data-board-commit-filter="' + option[0] + '" aria-pressed="' + (commitFilter === option[0] ? 'true' : 'false') + '">' + option[1] + '</button>';
  });
  html += '</div></div>';
  html += '</div>';

  html += '<div style="display:flex;flex-direction:column;gap:10px;">';
  visibleIds.forEach(function(pid){
    const p = DB.prospects[pid];
    if (!p) return;
    const searchText = [p.rank, '#' + p.rank, p.name, p.hometown].join(' ').toLowerCase();
    html += renderProspectBoardCard(pid, searchText);
  });
  if (!visibleIds.length) html += '<div class="rb-card" style="padding:28px;text-align:center;color:var(--slate);">No uncommitted prospects on this board.</div>';
  html += '</div>';
  return html;
}

function renderProspectBoardCard(pid, searchAttr){
  const p = DB.prospects[pid];
  if (!p) return '';
  const offers = DB.offersByProspect[pid] || [];
  const searchText = searchAttr || [p.rank, '#' + p.rank, p.name, p.hometown].join(' ').toLowerCase();
  const bucket = positionBucket(p.position);
  const currentThread = UI.view === 'thread' ? DB.threads.find(function(t){ return t.id === UI.threadId; }) : null;
  const commitReturn = currentThread ? { view: 'thread', threadId: currentThread.id, label: currentThread.title } : { view: 'feed', label: 'Prospect Board' };
  let html = '<div class="rb-card rb-mobile-tight" data-prospect-card="1" data-position-bucket="' + escapeHtml(bucket) + '" data-search="' + escapeHtml(searchText) + '" data-open-prospect="' + pid + '" style="padding:14px 18px;cursor:pointer;' + (p.commitTeam ? committedCardStyle(p.commitTeam) : '') + '">';
  html += '<div style="display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;">';
  html += '<div style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' +
    '<span class="rb-mono" style="color:var(--slate);">#' + p.rank + '</span> ' +
    '<span title="' + escapeHtml(p.name) + '" style="font-weight:600;color:var(--chalk);">' + escapeHtml(shortText(p.name, 24)) + '</span> ' +
    '<span class="rb-mono" style="color:var(--slate);font-size:13px;">' + escapeHtml(p.position) + (p.rating ? ' &middot; ' + escapeHtml(p.rating) : '') + '</span>' +
    (p.hometown ? '<span style="color:var(--slate);font-size:13px;"> &middot; <span title="' + escapeHtml(p.hometown) + '">' + escapeHtml(shortText(p.hometown, 28)) + '</span></span>' : '') +
  '</div>';
  html += '<div style="display:flex;align-items:center;gap:8px;white-space:nowrap;">' + (p.commitTeam ? '' : offerCountTag(pid)) + (p.commitTeam ? renderCommittedTag(p.commitTeam, true, commitReturn) : '') + '</div>';
  html += '</div>';
  if (!p.commitTeam) html += renderStorylineLine(p.storyline, 'margin-top:6px;');
  if (offers.length && !p.commitTeam){
    html += '<div style="margin-top:10px;border-top:1px solid var(--hairline);padding-top:10px;display:flex;flex-direction:column;gap:10px;">';
    offers.forEach(function(o){ html += renderOfferBlock(o, { collapsed: true }); });
    html += '</div>';
  }
  html += '</div>';
  return html;
}

  html += '<div class="rb-mono" style="font-size:13px;color:var(--slate);margin-top:4px;">' + escapeHtml(p.position) + (p.rating ? ' &middot; ' + escapeHtml(p.rating) : '') + (p.hometown ? ' &middot; ' + escapeHtml(p.hometown) : '') + '</div>';
  html += '</div>';
  html += '<div style="display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap;">' +
    (SESSION && !p.commitTeam ? (sessionOffer ? '<button class="rb-btn" disabled title="Your team already has an offer on this recruit">Offer submitted</button>' : (DB.offersLocked ? '<button class="rb-btn" disabled title="Offers are locked">Offers locked</button>' : '<button class="rb-btn rb-btn-gold" data-open-submit="' + escapeHtml(p.id) + '">Submit offer</button>')) : '') +
    (p.commitTeam ? renderCommittedTag(p.commitTeam, true, { view: 'prospect', prospectId: p.id, label: p.name }) : '') +
    '<span>' + starsOrLabel(p.stars) + '</span></div>';
  html += '</div>';
  html += renderStorylineLine(p.storyline, 'margin-top:8px;');
  html += renderLegacySchoolLine(p.legacySchool, 'margin-top:8px;');
  if (isPitchRecruit(p)){
    html += '<div class="rb-mono" style="font-size:10px;color:var(--slate);margin-top:8px;line-height:1.2;"><span style="color:var(--gold);">Pitch recruit:</span> personalized offer, up to 3 promises.</div>';
  } else {
    html += renderRecruitValues(p.values);
  }
  html += '</div>';
  if (!offers.length){
    html += '<div class="rb-card" style="padding:28px;text-align:center;color:var(--slate);">No offers yet.</div>';
    return html;
  }
  html += '<div style="display:flex;flex-direction:column;gap:12px;">';
  offers.forEach(function(o){ html += renderOfferBlock(o, { expanded: true, fullText: true }); });
  html += '</div>';
  return html;
}

function renderOfferBlock(o, opts){
  opts = opts || {};
  const badges = visitBadges(o.visits, !!opts.collapsed);
  const header = '<div class="rb-offer-block-header" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:' + (opts.collapsed ? 'nowrap' : 'wrap') + ';min-width:0;">' +
    '<span style="font-weight:600;font-size:13px;">' + escapeHtml(o.team) + '</span>' +
    '<span class="rb-offer-visit-wrap" style="display:flex;gap:6px;flex-wrap:' + (opts.collapsed ? 'nowrap' : 'wrap') + ';align-items:center;min-width:0;overflow:hidden;">' +
      (badges || '') +
      '<span class="rb-mono" style="font-size:11px;color:var(--slate);">' + escapeHtml(o.coach || '') + '</span>' +
    '</span>' +
  '</div>';
  let html = '';
  if (opts.collapsed){
    html += '<details data-offer-details="1" style="background:var(--panel-alt);border-radius:8px;padding:7px 12px;">';
    html += '<summary class="rb-offer-summary" style="list-style:none;cursor:pointer;">' + header + '</summary>';
    html += '<div style="margin-top:8px;">';
  } else {
    html += '<div style="background:var(--panel-alt);border-radius:8px;padding:10px 14px;">';
    if (!opts.hideHeader) html += header;
  }
  if (o.rescinded){
    html += '<div style="margin-top:8px;"><span class="rb-tag" style="display:inline-block;margin:0;color:var(--alert);border-color:#6F1D1B;background:rgba(111,29,27,0.18);font-weight:600;">Rescinded</span></div>';
    if (o.rescindReason) html += '<div class="rb-mono" style="font-size:11px;color:var(--slate);margin-top:6px;">' + escapeHtml(o.rescindReason) + '</div>';
  } else {
    const scrollStyle = opts.fullText ? '' : 'max-height:140px;overflow:auto;';
    html += '<div style="font-size:13px;color:var(--chalk);margin-top:6px;white-space:pre-wrap;' + scrollStyle + '" class="rb-scrollbar">' + formatOfferText(o.text, cleanDisplayPromises(o)) + '</div>';
  }
  const displayPromises = !o.rescinded ? cleanDisplayPromises(o) : [];
  if (displayPromises.length){
    html += '<div style="margin-top:8px;">';
    displayPromises.forEach(function(p){
      const title = titleForPromise(o, p);
      html += '<div class="rb-tag">' +
        '<span class="rb-mono" style="color:var(--gold);font-size:10px;text-transform:uppercase;letter-spacing:0.05em;">' + escapeHtml(String(title).replace(/_/g, ' ')) + ':</span> ' +
        escapeHtml(p.text) +
      '</div>';
    });
    html += '</div>';
  }
  if (o.editHistory && o.editHistory.length){
    html += '<details style="margin-top:8px;">';
    html += '<summary class="rb-offer-summary rb-mono" style="list-style:none;cursor:pointer;font-size:11px;color:var(--slate);">Edit history (' + o.editHistory.length + ')</summary>';
    html += '<div style="margin-top:6px;display:flex;flex-direction:column;gap:6px;">';
    o.editHistory.slice().reverse().forEach(function(entry){
      html += '<div style="border-top:1px solid var(--hairline);padding-top:6px;font-size:11px;color:var(--slate);line-height:1.45;">';
      html += '<div class="rb-mono" style="color:var(--gold);">' + escapeHtml(new Date(entry.editedAt).toLocaleString()) + '</div>';
      (entry.changes || []).forEach(function(change){ html += '<div>' + escapeHtml(change) + '</div>'; });
      html += '</div>';
    });
    html += '</div></details>';
  }
  html += opts.collapsed ? '</div></details>' : '</div>';
  return html;
}

function bindEvents(){
  const backTopBtn = document.getElementById('rb-back-top');
  if (backTopBtn) backTopBtn.onclick = function(){ scrollPageTop(true); };
  updateBackTopControl();

  document.querySelectorAll('[data-nav]').forEach(function(el){
    el.onclick = function(){
      navigateTo(el.getAttribute('data-nav'));
    };
  });
  document.querySelectorAll('[data-open-thread]').forEach(function(el){
    el.onclick = function(){
      navigateTo('thread', { threadId: el.getAttribute('data-open-thread') });
      scrollPageTop();

  function applyPositionListFilters(kind, filterKey){
    const search = kind === 'commits' ? document.getElementById('rb-my-commit-search') : (kind === 'board' ? document.querySelector('[data-thread-search]') : document.getElementById('rb-my-offer-search'));
    const q = search ? search.value.toLowerCase().trim() : '';
    const selector = kind === 'commits' ? '[data-my-commit-card]' : (kind === 'board' ? '[data-prospect-card]' : '[data-my-offer-card]');
    const activeKeys = {};
    document.querySelectorAll('[data-position-filter]').forEach(function(el){
      const key = el.getAttribute('data-position-filter') || '';
      if (filterKey && key !== filterKey) return;
      if (key.indexOf(kind + ':') === 0) activeKeys[key] = true;
    });
    document.querySelectorAll(selector).forEach(function(card){
      const haystack = card.getAttribute('data-search') || '';
      const bucket = card.getAttribute('data-position-bucket') || '';
      let hiddenByPosition = false;
      Object.keys(UI.positionFilters || {}).forEach(function(key){
        if (!activeKeys[key]) return;
        if ((UI.positionFilters[key] || {})[bucket]) hiddenByPosition = true;
      });
      card.style.display = (!q || haystack.indexOf(q) !== -1) && !hiddenByPosition ? '' : 'none';
    });
  }

  document.querySelectorAll('[data-position-filter]').forEach(function(el){
    el.onclick = function(){
      const key = el.getAttribute('data-position-filter') || '';
      const bucket = el.getAttribute('data-position-bucket') || '';
      if (!key || !bucket) return;
      if (!UI.positionFilters) UI.positionFilters = {};
      if (!UI.positionFilters[key]) UI.positionFilters[key] = {};
      UI.positionFilters[key][bucket] = !UI.positionFilters[key][bucket];
      el.classList.toggle('rb-position-count-muted', !!UI.positionFilters[key][bucket]);
      el.setAttribute('aria-pressed', UI.positionFilters[key][bucket] ? 'true' : 'false');
      applyPositionListFilters(key.split(':')[0] || 'offers', key);
    };
  });

  document.querySelectorAll('[data-position-set]').forEach(function(el){
    el.onclick = function(){
      const key = el.getAttribute('data-position-set') || '';
      const mode = el.getAttribute('data-position-set-mode') || 'all';
      if (!key) return;
      if (!UI.positionFilters) UI.positionFilters = {};
      UI.positionFilters[key] = {};
      if (mode === 'none'){
        document.querySelectorAll('[data-position-filter="' + cssEscape(key) + '"]').forEach(function(chip){
          const bucket = chip.getAttribute('data-position-bucket') || '';
          if (bucket) UI.positionFilters[key][bucket] = true;
        });
      }
      document.querySelectorAll('[data-position-filter="' + cssEscape(key) + '"]').forEach(function(chip){
        const bucket = chip.getAttribute('data-position-bucket') || '';
        const muted = !!(bucket && UI.positionFilters[key][bucket]);
        chip.classList.toggle('rb-position-count-muted', muted);
        chip.setAttribute('aria-pressed', muted ? 'true' : 'false');
      });
      applyPositionListFilters(key.split(':')[0] || 'offers', key);
    };
  });

  const release1 = document.getElementById('rb-release-1');

}

applyRoute(routeFromPath(window.location.pathname));

window.addEventListener('scroll', updateBackTopControl, { passive: true });

  if (!canLeaveTeamsPage()){
    syncBrowserRoute(true);
    return;

  applyRoute(routeFromPath(window.location.pathname));
  render();
  if (UI.view === 'teams') loadTeamAvailability().then(render);
  scrollPageTop();
});
window.addEventListener('beforeunload', function(e){
  if (!hasPendingTeamChanges()) return;

});
if ('serviceWorker' in navigator && /^https?:$/.test(window.location.protocol)) {
  navigator.serviceWorker.register('/sw.js').catch(function(e){ console.warn('service worker registration failed', e); });
}
loadAll();

})();
