.rb-root {

body { margin: 0; background: #0F1420; }

.rb-segmented {

function canUseBrowserRoutes(){

function routeFromPath(pathname){
  let path = String(pathname || '/').replace(/\/+$/, '');
  if (!path || path === '/index.html') path = '/';
  if (path === '/' || path === '/prospectboard' || path === '/board') return { view: 'feed' };
  if (path === '/myoffers') return { view: 'myoffers' };
  if (path === '/mycommits') return { view: 'mycommits' };
  if (path === '/teams') return { view: 'teams' };
  if (path === '/settings') return { view: 'setup' };
  const prospectMatch = path.match(/^\/prospect\/([^/]+)$/);
  if (prospectMatch) return { view: 'prospect', prospectId: decodeURIComponent(prospectMatch[1]) };
  const boardMatch = path.match(/^\/prospectboard\/([^/]+)$/);
  if (boardMatch) return { view: 'thread', threadId: decodeURIComponent(boardMatch[1]) };
  const teamCommitsMatch = path.match(/^\/teams\/([^/]+)\/commits$/);
  if (teamCommitsMatch) return { view: 'teamcommits', teamCommitsTeam: decodeURIComponent(teamCommitsMatch[1]) };
  const teamOffersMatch = path.match(/^\/teams\/([^/]+)\/offers$/);
  if (teamOffersMatch) return { view: 'teamoffers', teamOffersTeam: decodeURIComponent(teamOffersMatch[1]) };
  return { view: 'feed' };
}

function pathForView(view){

  if (view === 'teamoffers' && UI.teamOffersTeam) return '/teams/' + encodeURIComponent(UI.teamOffersTeam) + '/offers';

function escapeHtml(s){

  });
}

function cssEscape(value){
  if (window.CSS && typeof window.CSS.escape === 'function') return window.CSS.escape(String(value || ''));

}

function uniquePush(list, value){
  value = String(value || '').replace(/\s+/g, ' ').trim();
  if (!value) return;
  const key = value.toLowerCase();
  if (list.some(function(item){ return item.toLowerCase() === key; })) return;
  list.push(value);
}

function formatOfferText(text, promises){
  const raw = String(text || '');
  const clean = raw.replace(/\*\*([\s\S]*?)\*\*/g, '$1');
  const phrases = [];
  raw.replace(/\*\*([\s\S]*?)\*\*/g, function(_, phrase){
    uniquePush(phrases, phrase);
    return phrase;
  });
  (promises && promises.length ? promises : extractPromises(raw)).forEach(function(p){
    uniquePush(phrases, p && p.text);
  });

  const ranges = [];
  const lower = clean.toLowerCase();
  phrases.sort(function(a,b){ return b.length - a.length; }).forEach(function(phrase){
    const needle = phrase.toLowerCase();
    let start = lower.indexOf(needle);
    while (start !== -1){
      const end = start + phrase.length;
      const overlaps = ranges.some(function(r){ return start < r.end && end > r.start; });
      if (!overlaps) ranges.push({ start: start, end: end });
      start = lower.indexOf(needle, end);
    }
  });
  ranges.sort(function(a,b){ return a.start - b.start; });
  if (!ranges.length) return escapeHtml(clean);

  let html = '';
  let cursor = 0;
  ranges.forEach(function(range){
    html += escapeHtml(clean.slice(cursor, range.start));
    html += '<strong style="color:var(--gold);font-weight:800;">' + escapeHtml(clean.slice(range.start, range.end)) + '</strong>';
    cursor = range.end;
  });
  html += escapeHtml(clean.slice(cursor));
  return html;
}

function teamBrandKeys(team){

  [region, name, abbrev, (region + ' ' + name).trim()].forEach(function(value){
    const key = teamKey(value);

  });
  return keys;
}

    seen[teamKey(brand.region)] = true;
    brands.push(brand);
  });

  return Object.keys(links).map(function(key){ return links[key]; }).find(function(link){

function hasAppStorage(){

}

async function getStored(key, shared){
  if (hasAppStorage()) return window.storage.get(key, shared);
  try {
    const value = window.localStorage.getItem(key);
    return value == null ? null : { value: value };
  } catch (e) {
    return null;
  }
}

function setStored(key, value, shared){
  if (hasAppStorage()) return window.storage.set(key, value, shared).catch(function(e){ console.error('save failed', e); });
  try {
    window.localStorage.setItem(key, value);
  } catch (e) {
    console.error('save failed', e);
  }
  return Promise.resolve();
}

function deleteStored(key, shared){
  if (hasAppStorage()) return window.storage.delete(key, shared).catch(function(){});
  try {
    window.localStorage.removeItem(key);
  } catch (e) {}
  return Promise.resolve();
}

async function loadServerAuth(){
  if (!apiAvailable()) return;
  try {
    const res = await fetch('/api/auth/me', { credentials: 'include' });
    if (!res.ok) return;
    const data = await res.json();
    if (data.authenticated && data.user){
      UI.pendingDiscordUser = data.user;
      if (data.user.team){
        SESSION = {
          discordId: data.user.discordId,
          username: data.user.displayName || data.user.username,
          team: data.user.team,
          accessLevel: userAccessLevel(data.user),
          isAdmin: !!data.user.isAdmin,
          isModerator: !!data.user.isModerator,
          isCommissioner: !!data.user.isCommissioner
        };
      } else {
        SESSION = null;
        UI.loginStep = 'team';
      }
      await loadTeamAvailability();
    }
  } catch (e) { /* local preview or functions not configured */ }
}

async function loadTeamAvailability(){
  if (!apiAvailable()) return;
  try {
    const res = await fetch('/api/teams', { credentials: 'include' });
    if (!res.ok) return;
    const data = await res.json();
    UI.unavailableTeamKeys = data.claimedTeams || [];
    UI.teamLinks = data.links || {};
    if (Array.isArray(data.teams)){
      const branding = Object.assign({}, DB.teamBranding || {});
      data.teams.forEach(function(brand){
        if (!brand || !brand.region) return;
        teamBrandKeys(brand).forEach(function(key){ branding[key] = brand; });
      });
      DB.teamBranding = branding;
    }
  } catch (e) { /* non-blocking */ }
}

    threads: DB.threads,

  });

  });

// ---------- CSV parsing ----------

function parseCsvRows(text){
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){ if (text[i+1] === '"'){ field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r'){
        if (c === '\r' && text[i+1] === '\n') i++;
        row.push(field); field = ''; rows.push(row); row = [];
      } else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function cleanCsvCell(value){
  return String(value == null ? '' : value).replace(/^\uFEFF/, '').trim();
}

function headerIndex(header, names){
  for (let i = 0; i < header.length; i++){
    const cell = cleanCsvCell(header[i]).toLowerCase();
    for (let j = 0; j < names.length; j++){
      if (cell === names[j].toLowerCase()) return i;
    }
  }
  return -1;
}

const RECRUIT_VALUE_FIELDS = [
  { key: 'location', label: 'Location', names: ['Location'] },
  { key: 'winning', label: 'Winning', names: ['Winning'] },
  { key: 'playingTime', label: 'Playing Time', names: ['Playing Time', 'PlayingTime'] },
  { key: 'coach', label: 'Coach', names: ['Coach'] },
  { key: 'proPotential', label: 'Pro Potential', names: ['ProPotential', 'Pro Potential'] },
  { key: 'prestige', label: 'Prestige', names: ['Prestige'] },
  { key: 'education', label: 'Education', names: ['Education'] },
  { key: 'campus', label: 'Campus', names: ['Campus'] },
  { key: 'tradition', label: 'Tradition', names: ['Tradition'] }
];

function parseRecruitValues(row, header){
  const values = {};
  RECRUIT_VALUE_FIELDS.forEach(function(field){
    const idx = headerIndex(header, field.names);
    if (idx === -1) return;
    const n = parseFloat(cleanCsvCell(row[idx]));
    if (!Number.isFinite(n)) return;
    values[field.key] = Math.max(0, Math.min(1, n));
  });
  return values;
}

function prospectFromRosterRow(p, id){
  return {
    id: id,
    rank: p.rank,
    name: p.name,
    position: p.position,
    rating: p.rating,
    overall: p.overall || 0,
    potential: p.potential || 0,
    hometown: p.hometown,
    legacySchool: p.legacySchool || '',
    storyline: p.storyline || '',
    offerMode: p.offerMode || (recruitingStageConfig().pitchOnly ? 'pitch' : 'values'),
    values: p.values || {},
    stars: starsForRank(p.rank)
  };
}

function hydrateProspectValuesFromRoster(){
  if (!DB.fullRoster.length || !Object.keys(DB.prospects || {}).length) return false;
  const rosterByRank = {};
  DB.fullRoster.forEach(function(p){ rosterByRank[p.rank] = p; });
  let changed = false;
  Object.keys(DB.prospects || {}).forEach(function(pid){
    const prospect = DB.prospects[pid];
    const roster = prospect && rosterByRank[prospect.rank];
    if (!prospect || !roster) return;
    if (roster.values && JSON.stringify(prospect.values || {}) !== JSON.stringify(roster.values)){
      prospect.values = roster.values;
      changed = true;
    }
    if ((prospect.offerMode || '') !== (roster.offerMode || '')){
      prospect.offerMode = roster.offerMode || '';
      changed = true;
    }
    if (Object.prototype.hasOwnProperty.call(roster, 'legacySchool') && (prospect.legacySchool || '') !== (roster.legacySchool || '')){
      prospect.legacySchool = roster.legacySchool || '';
      changed = true;
    }
    if (roster.storyline && !prospect.storyline){
      prospect.storyline = roster.storyline;
      changed = true;
    }
  });
  return changed;
}

function applyRecruitingStageProfile(list, stage){
  stage = RECRUITING_STAGES[stage] ? stage : recruitingStage();
  if (stage === 'transfer'){
    list.forEach(function(p){
      p.offerMode = 'pitch';
      p.values = {};
    });
  } else if (stage === 'cpr'){
    let pitchRecruit = null;
    list.forEach(function(p){
      if (!pitchRecruit || p.overall > pitchRecruit.overall || (p.overall === pitchRecruit.overall && p.potential > pitchRecruit.potential)){
        pitchRecruit = p;
      }
    });
    list.forEach(function(p){
      p.offerMode = pitchRecruit && p.rank === pitchRecruit.rank ? 'pitch' : 'values';
      p.values = isPitchRecruit(p) ? {} : fixedCprValues();
    });
  } else {
    list.forEach(function(p){
      p.offerMode = 'values';
    });
  }
  return list;
}

function parseFullClass(text, options){
  options = options || {};
  const stage = RECRUITING_STAGES[options.stage] ? options.stage : recruitingStage();
  const rows = parseCsvRows(text);
  let headerIdx = -1;
  for (let i = 0; i < rows.length; i++){
    if (headerIndex(rows[i], ['Name']) !== -1 && headerIndex(rows[i], ['Pos.', 'Pos', 'Position']) !== -1) { headerIdx = i; break; }
  }
  if (headerIdx === -1) return null;
  const header = rows[headerIdx];
  const rankIdx = headerIndex(header, ['Rank', '#']);
  const nameIdx = headerIndex(header, ['Name']);
  const posIdx = headerIndex(header, ['Pos.', 'Pos', 'Position']);
  const ovrIdx = headerIndex(header, ['Ovr', 'Overall']);
  const potIdx = headerIndex(header, ['Pot', 'Potential']);
  const hometownIdx = headerIndex(header, ['Hometown', 'Home Town']);
  let legacySchoolIdx = headerIndex(header, ['Legacy School', 'Legacy']);
  if (legacySchoolIdx === -1) legacySchoolIdx = 16;
  let storylineIdx = headerIndex(header, ['Storyline', 'Storylines']);
  if (storylineIdx === -1) storylineIdx = 18;
  const list = [];
  for (let i = headerIdx + 1; i < rows.length; i++){
    const r = rows[i];
    const rank = parseInt(cleanCsvCell(r[rankIdx === -1 ? 0 : rankIdx]), 10);
    if (!rank) continue;
    const name = cleanCsvCell(r[nameIdx]);
    if (!name) continue;
    const overall = parseFloat(cleanCsvCell(r[ovrIdx]));
    const potential = parseFloat(cleanCsvCell(r[potIdx]));
    list.push({
      rank: rank, name: name,
      position: cleanCsvCell(r[posIdx]).toUpperCase(),
      rating: cleanCsvCell(r[ovrIdx]) + '/' + cleanCsvCell(r[potIdx]),
      overall: Number.isFinite(overall) ? overall : 0,
      potential: Number.isFinite(potential) ? potential : 0,
      hometown: cleanCsvCell(r[hometownIdx]),
      legacySchool: cleanCsvCell(r[legacySchoolIdx]),
      storyline: cleanCsvCell(r[storylineIdx]),
      values: stage === 'hs' ? parseRecruitValues(r, header) : {}
    });
  }
  list.sort(function(a,b){ return a.rank - b.rank; });
  return applyRecruitingStageProfile(list, stage);
}

function starsForRank(rank){
  if (rank <= 25) return 5;
  if (rank <= 250) return 4;
  if (rank <= 500) return 3;
  if (rank <= 900) return 2;
  if (rank <= 1700) return 1;
  return 0;
}

  };
  reader.onerror = function(){
    UI.classError = 'Could not read that CSV file. Try pasting the export instead.';
    render();
  };
  reader.readAsText(file);
}

async function fileToText(file){
  const buffer = await file.arrayBuffer();
  if (/\.gz$/i.test(file.name || '')){
    if (typeof DecompressionStream === 'undefined') throw new Error('This browser cannot read .gz files directly. Try an unzipped JSON export.');
    const stream = new Blob([buffer]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(stream).text();
  }
  return new TextDecoder().decode(buffer);
}

async function loadTeamBrandingFile(file){
  if (!file) return;
  UI.brandingFileName = file.name || '';
  UI.brandingError = null;
  UI.brandingStatus = null;
  render();
  try {
    const text = await fileToText(file);
    const data = JSON.parse(text);
    if (!data || !Array.isArray(data.teams)) throw new Error('No teams array found in that export.');
    const branding = Object.assign({}, DB.teamBranding || {});
    const activeBrands = [];
    let count = 0;
    data.teams.forEach(function(team){
      if (!team || !team.region || team.disabled) return;
      const colors = Array.isArray(team.colors) ? team.colors : [];
      const brand = {
        region: team.region || '',
        nickname: team.name || '',
        abbrev: team.abbrev || '',
        displayName: (team.region || '') + (team.name ? ' ' + team.name : ''),
        primary: colors[0] || '',
        secondary: colors[1] || colors[2] || '',
        logoUrl: team.imgURL || ''
      };
      teamBrandKeys(brand).forEach(function(key){ branding[key] = brand; });
      activeBrands.push(brand);
      count++;
    });
    DB.teamBranding = branding;
    if (apiAvailable()){
      const res = await fetch('/api/admin/team-branding', {
        method: 'POST',
        credentials: 'include',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ teams: activeBrands }),
      });
      const apiResult = await res.json().catch(function(){ return {}; });
      if (!res.ok || !apiResult.ok) throw new Error(apiResult.error || 'Could not save branding update on the server.');
    }
    UI.brandingStatus = 'Branding updated for ' + count + ' active team' + (count === 1 ? '' : 's') + '.';
    UI.brandingError = null;
    saveDB(); render();
  } catch (e) {
    UI.brandingError = e.message || 'Could not import team branding.';
    render();
  }
}

function releaseSingleStageBoard(){

    ids.push(id);

  DB.wave2Released = true;

function releaseWave1(){
  if (!DB.fullRoster.length || DB.wave1Released) return;
  const g5 = [], g4 = [], g3 = [];
  DB.fullRoster.forEach(function(p){
    if (p.rank > 500 || DB.released[p.rank]) return;
    const stars = starsForRank(p.rank);
    const id = 'r' + p.rank;
    DB.prospects[id] = prospectFromRosterRow(p, id);
    DB.released[p.rank] = true;
    if (stars === 5) g5.push(id); else if (stars === 4) g4.push(id); else g3.push(id);
  });
  if (g5.length) DB.threads.push(makeThread('5 Star Recruiting Board', g5, 5));
  if (g4.length) DB.threads.push(makeThread('4 Star Recruiting Board', g4, 4));
  if (g3.length) DB.threads.push(makeThread('3 Star Recruiting Board', g3, 3));
  DB.wave1Released = true;
  saveDB(); render();
}

function releaseWave2(){
  if (!DB.fullRoster.length || DB.wave2Released) return;
  const g2 = [], g1 = [], g0 = [];
  DB.fullRoster.forEach(function(p){
    if (p.rank <= 500 || DB.released[p.rank]) return;
    const stars = starsForRank(p.rank);
    const id = 'r' + p.rank;
    DB.prospects[id] = prospectFromRosterRow(p, id);
    DB.released[p.rank] = true;
    if (stars === 2) g2.push(id); else if (stars === 1) g1.push(id); else g0.push(id);
  });
  if (g2.length) DB.threads.push(makeThread('2 Star Recruiting Board', g2, 2));
  if (g1.length) DB.threads.push(makeThread('1 Star Recruiting Board', g1, 1));
  if (g0.length) DB.threads.push(makeThread('Unranked Recruiting Board', g0, 0));
  DB.wave2Released = true;
  saveDB(); render();
}

// ---------- Commit sheet ----------

function normalizeCommitSheetUrl(url){
  const raw = (url || '').trim();
  if (!raw) return '';
  const idMatch = raw.match(/\/spreadsheets\/d\/([^/]+)/);
  if (!idMatch) return raw;
  const gidMatch = raw.match(/[?&#]gid=(\d+)/);
  return 'https://docs.google.com/spreadsheets/d/' + idMatch[1] + '/export?format=csv' + (gidMatch ? '&gid=' + gidMatch[1] : '');
}

function commitSheetUrlCandidates(url){
  const raw = (url || '').trim();
  if (!raw) return [];
  const idMatch = raw.match(/\/spreadsheets\/d\/([^/]+)/);
  if (!idMatch) return [raw];
  const sheetId = idMatch[1];
  const gidMatch = raw.match(/[?&#]gid=(\d+)/);
  const gid = gidMatch ? gidMatch[1] : '0';
  return [
    'https://docs.google.com/spreadsheets/d/' + sheetId + '/export?format=csv&gid=' + gid,
    'https://docs.google.com/spreadsheets/d/' + sheetId + '/gviz/tq?tqx=out:csv&gid=' + gid,
    raw
  ];
}

function commitSheetParts(url){
  const raw = (url || '').trim();
  const idMatch = raw.match(/\/spreadsheets\/d\/([^/]+)/);
  if (!idMatch) return null;
  const gidMatch = raw.match(/[?&#]gid=(\d+)/);
  return { sheetId: idMatch[1], gid: gidMatch ? gidMatch[1] : '0' };
}

function gvizTableToRows(table){
  const cols = table && table.cols ? table.cols : [];
  const rows = [];
  rows.push(cols.map(function(col){ return col.label || col.id || ''; }));
  (table && table.rows ? table.rows : []).forEach(function(row){
    rows.push((row.c || []).map(function(cell){
      if (!cell) return '';
      return cell.f != null ? cell.f : (cell.v != null ? cell.v : '');
    }));
  });
  return rows;
}

function fetchCommitRowsJsonp(url){
  const parts = commitSheetParts(url);
  if (!parts) return Promise.reject(new Error('Not a Google Sheets URL'));
  return new Promise(function(resolve, reject){
    const cb = 'rbCommitJsonp_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    const cleanup = function(){
      delete window[cb];
      if (script.parentNode) script.parentNode.removeChild(script);
    };
    const timer = setTimeout(function(){
      cleanup();
      reject(new Error('Google Sheets JSONP timed out'));
    }, 12000);
    window[cb] = function(resp){
      clearTimeout(timer);
      cleanup();
      if (!resp || resp.status === 'error'){
        reject(new Error((resp && resp.errors && resp.errors[0] && resp.errors[0].detailed_message) || 'Google Sheets JSONP failed'));
        return;
      }
      resolve(gvizTableToRows(resp.table));
    };
    script.onerror = function(){
      clearTimeout(timer);
      cleanup();
      reject(new Error('Google Sheets JSONP script failed'));
    };
    script.src = 'https://docs.google.com/spreadsheets/d/' + encodeURIComponent(parts.sheetId) + '/gviz/tq?gid=' + encodeURIComponent(parts.gid) + '&tqx=responseHandler:' + cb;
    document.head.appendChild(script);
  });
}

async function fetchCommitCsv(url){
  const candidates = commitSheetUrlCandidates(url);
  let lastError = null;
  for (let i = 0; i < candidates.length; i++){
    try {
      const res = await fetch(candidates[i]);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      if (/^\s*</.test(text)) throw new Error('Google returned HTML instead of CSV');
      return text;
    } catch (e) {
      lastError = e;
    }
  }
  throw lastError || new Error('No sheet URL worked');
}

async function fetchCommitRows(url){
  try {
    const csv = await fetchCommitCsv(url);
    return parseCsvRows(csv);
  } catch (fetchError) {
    return fetchCommitRowsJsonp(url);
  }
}

function commitCellValue(value){
  const text = cleanCsvCell(value);
  if (!text || /^commit(?:ted)?$/i.test(text) || /^school$/i.test(text)) return '';
  return canonicalTeamName(text);
}

function findProspectFromSheetRow(row, rankIdx, nameIdx){
  const rank = parseInt(cleanCsvCell(row[rankIdx === -1 ? 0 : rankIdx]), 10);
  let prospect = rank ? DB.prospects['r' + rank] : null;
  if (!prospect && nameIdx !== -1){
    const name = cleanCsvCell(row[nameIdx]).toLowerCase();
    const matches = Object.keys(DB.prospects).map(function(id){ return DB.prospects[id]; }).filter(function(p){
      return p.name && p.name.toLowerCase() === name;
    });
    if (matches.length === 1) prospect = matches[0];
  }
  return prospect;
}

function applyStorylineRows(rows){
  let headerIdx = -1;
  for (let i = 0; i < rows.length; i++){
    if (headerIndex(rows[i], ['Name']) !== -1 || headerIndex(rows[i], ['Rank', '#']) !== -1) { headerIdx = i; break; }
  }
  const header = headerIdx === -1 ? [] : rows[headerIdx];
  const start = headerIdx === -1 ? 0 : headerIdx + 1;
  const rankIdx = headerIndex(header, ['Rank', '#']);
  const nameIdx = headerIndex(header, ['Name']);
  let legacySchoolIdx = headerIndex(header, ['Legacy School', 'Legacy']);
  if (legacySchoolIdx === -1) legacySchoolIdx = 16;
  let storylineIdx = headerIndex(header, ['Storyline', 'Storylines']);
  if (storylineIdx === -1) storylineIdx = 18;
  let storylineCount = 0;
  let legacySchoolCount = 0;
  for (let i = start; i < rows.length; i++){
    const storyline = cleanCsvCell(rows[i][storylineIdx]);
    const legacySchool = cleanCsvCell(rows[i][legacySchoolIdx]);
    const prospect = findProspectFromSheetRow(rows[i], rankIdx, nameIdx);
    if (!prospect) continue;
    if (storyline && !prospect.storyline){
      prospect.storyline = storyline;
      storylineCount++;
    }
    if (legacySchool && (prospect.legacySchool || '') !== legacySchool){
      prospect.legacySchool = legacySchool;
      legacySchoolCount++;
    }
  }
  return { storylineCount: storylineCount, legacySchoolCount: legacySchoolCount };
}

function applyCommitRows(rows){
  let headerIdx = -1;
  for (let i = 0; i < rows.length; i++){
    if (headerIndex(rows[i], ['Name']) !== -1 || headerIndex(rows[i], ['Rank', '#']) !== -1) { headerIdx = i; break; }
  }
  const header = headerIdx === -1 ? [] : rows[headerIdx];
  const start = headerIdx === -1 ? 0 : headerIdx + 1;
  const rankIdx = headerIndex(header, ['Rank', '#']);
  const nameIdx = headerIndex(header, ['Name']);
  let commitIdx = headerIndex(header, ['Commit', 'Committed', 'School', 'Team']);
  if (commitIdx === -1) commitIdx = 17;
  let count = 0;

  Object.keys(DB.prospects || {}).forEach(function(pid){
    if (DB.prospects[pid]) DB.prospects[pid].commitTeam = '';
  });

  for (let i = start; i < rows.length; i++){
    const r = rows[i];
    const commitTeam = commitCellValue(r[commitIdx]);
    if (!commitTeam) continue;
    const prospect = findProspectFromSheetRow(r, rankIdx, nameIdx);
    if (prospect){
      prospect.commitTeam = commitTeam;
      count++;
    }
  }
  applyManualCommitOverrides();
  applyConditionalRescinds();
  DB.commitUpdatedAt = Date.now();
  return count;
}

function applyManualCommitOverrides(){
  const overrides = DB.manualCommitOverrides || {};
  Object.keys(overrides).forEach(function(pid){
    const prospect = DB.prospects && DB.prospects[pid];
    const team = canonicalTeamName(overrides[pid] && overrides[pid].team);
    if (prospect && team) prospect.commitTeam = team;
  });
}

async function applyManualCommitOverride(){
  const rankInput = document.getElementById('rb-commit-override-rank');
  const teamInput = document.getElementById('rb-commit-override-team');
  const rank = parseInt(rankInput ? rankInput.value : UI.commitOverrideRank, 10);
  const rawTeam = teamInput ? teamInput.value.trim() : UI.commitOverrideTeam;
  UI.commitOverrideRank = rankInput ? rankInput.value.trim() : UI.commitOverrideRank;
  UI.commitOverrideTeam = rawTeam;
  UI.commitOverrideError = null;
  UI.commitOverrideStatus = null;
  if (!rank){
    UI.commitOverrideError = 'Enter the player rank to override.';
    render(); return;
  }
  const pid = 'r' + rank;
  const prospect = DB.prospects && DB.prospects[pid];
  if (!prospect){
    UI.commitOverrideError = 'No opened prospect exists for rank #' + rank + '.';
    render(); return;
  }
  const team = canonicalTeamName(rawTeam);
  if (!team){
    UI.commitOverrideError = 'Enter the team that won the commit.';
    render(); return;
  }
  if (!DB.manualCommitOverrides) DB.manualCommitOverrides = {};
  DB.manualCommitOverrides[pid] = { team: team, updatedAt: Date.now() };
  prospect.commitTeam = team;
  applyConditionalRescinds();
  DB.commitUpdatedAt = Date.now();
  UI.commitOverrideStatus = '#' + rank + ' ' + prospect.name + ' manually committed to ' + team + '.';
  await saveDBNow();
  render();
}

async function clearManualCommitOverride(){
  const rankInput = document.getElementById('rb-commit-override-rank');
  const rank = parseInt(rankInput ? rankInput.value : UI.commitOverrideRank, 10);
  UI.commitOverrideRank = rankInput ? rankInput.value.trim() : UI.commitOverrideRank;
  UI.commitOverrideError = null;
  UI.commitOverrideStatus = null;
  if (!rank){
    UI.commitOverrideError = 'Enter the player rank to clear.';
    render(); return;
  }
  const pid = 'r' + rank;
  const prospect = DB.prospects && DB.prospects[pid];
  if (!prospect){
    UI.commitOverrideError = 'No opened prospect exists for rank #' + rank + '.';
    render(); return;
  }
  if (DB.manualCommitOverrides) delete DB.manualCommitOverrides[pid];
  prospect.commitTeam = '';
  applyConditionalRescinds();
  DB.commitUpdatedAt = Date.now();
  UI.commitOverrideTeam = '';
  UI.commitOverrideStatus = 'Manual override cleared for #' + rank + ' ' + prospect.name + '.';
  await saveDBNow();
  render();
}

async function updateCommitsFromSheet(){
  const input = document.getElementById('rb-commit-sheet-url');
  const rawUrl = (input ? input.value : DB.commitSheetUrl || '').trim();
  if (!apiAvailable() && !rawUrl){
    UI.commitError = 'Save the season commit sheet URL first.';
    render(); return;
  }
  UI.updatingCommits = true;
  UI.commitError = null;
  UI.commitStatus = null;
  render();
  if (apiAvailable()){
    try {
      const res = await fetch('/api/commits/discord', { method: 'POST', credentials: 'include' });
      const data = await res.json().catch(function(){ return {}; });
      if (res.ok && data.ok){
        await syncLeagueState(false);
        UI.commitStatus = 'Manual push updated: ' + data.updated + ' changed, ' + data.unchanged + ' already current, ' + data.commitsFound + ' found in ' + data.messagesRead + ' messages' + (data.unmatchedCount ? ', ' + data.unmatchedCount + ' unmatched' : '') + '.';
        UI.updatingCommits = false;
        render();
        return;
      }
      UI.commitError = data.error || 'Discord commit updater is not configured yet.';
      if (!rawUrl){
        UI.updatingCommits = false;
        render();
        return;
      }
    } catch (e) {
      UI.commitError = e.message || 'Could not update commits from Discord.';
      if (!rawUrl){
        UI.updatingCommits = false;
        render();
        return;
      }
    }
  }
  try {
    const rows = await fetchCommitRows(rawUrl);
    const count = applyCommitRows(rows);
    const metadata = applyStorylineRows(rows);
    const storylineCount = metadata.storylineCount || 0;
    const legacySchoolCount = metadata.legacySchoolCount || 0;
    const importParts = [];
    if (storylineCount) importParts.push(storylineCount + ' storyline' + (storylineCount === 1 ? '' : 's'));
    if (legacySchoolCount) importParts.push(legacySchoolCount + ' legacy school' + (legacySchoolCount === 1 ? '' : 's'));
    DB.commitSheetUrl = rawUrl;
    UI.commitEditing = false;
    UI.commitStatus = 'Sheet fallback updated ' + count + ' commit' + (count === 1 ? '' : 's') + (importParts.length ? ' and imported ' + importParts.join(' and ') : '') + '.';
    await saveDBNow();
  } catch (e) {
    UI.commitError = UI.commitError || 'Could not update commits from Discord or read the sheet fallback.';
  }
  UI.updatingCommits = false;
  render();
}

async function linkLoginTeam(team){
  team = String(team || '').trim();
  if (!team){
    UI.loginError = 'Enter your team.';
    render(); return;
  }
  const brand = getTeamBranding(team);
  if (!brand){
    UI.loginError = 'That team is not available.';
    render(); return;
  }
  const canonicalTeam = brand.region || team;
  if (!isTeamAvailable(canonicalTeam)){
    UI.loginError = canonicalTeam + ' is already linked to another Discord account.';
    render(); return;
  }
  if (!apiAvailable() || !UI.pendingDiscordUser){
    UI.loginError = 'Sign in with Discord before linking a team.';
    render(); return;
  }
  try {
    const res = await fetch('/api/team/link', {
      method: 'POST',
      credentials: 'include',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ team: canonicalTeam }),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'Could not link team.');
    if (data.purgedOffers) await syncLeagueState(false, { force: true });
    UI.pendingDiscordUser = Object.assign({}, UI.pendingDiscordUser, { team: canonicalTeam });
    SESSION = {
      discordId: UI.pendingDiscordUser.discordId,
      username: UI.pendingDiscordUser.displayName || UI.pendingDiscordUser.username,
      team: canonicalTeam,
      accessLevel: userAccessLevel(UI.pendingDiscordUser),
      isAdmin: !!UI.pendingDiscordUser.isAdmin,
      isModerator: !!UI.pendingDiscordUser.isModerator,
      isCommissioner: !!UI.pendingDiscordUser.isCommissioner
    };
    UI.loginError = null;
    UI.loginStep = 'account';
    UI.teamLinkQuery = '';
    UI.view = 'feed';
    await loadTeamAvailability();
    render();
  } catch (e) {
    UI.loginError = e.message || 'Could not link that team.';
    render();
  }
}

async function runAdminAccountAction(kind, overrides){
  overrides = overrides || {};
  const discordIdInput = document.getElementById(kind === 'switch' ? 'rb-admin-switch-discord' : 'rb-admin-unlink-discord');
  const teamInput = document.getElementById(kind === 'switch' ? 'rb-admin-switch-team' : 'rb-admin-unlink-team');
  const endpoint = kind === 'switch' ? '/api/admin/switch-team' : '/api/admin/unlink';
  UI.adminActionError = null;
  UI.adminActionStatus = null;
  try {
    const discordId = overrides.discordId != null ? overrides.discordId : (discordIdInput ? discordIdInput.value : '');
    const team = overrides.team != null ? overrides.team : (teamInput ? teamInput.value : '');
    const res = await fetch(endpoint, {
      method: 'POST',
      credentials: 'include',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ discordId: discordId, team: team }),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'Admin action failed.');
    if (data.purgedOffers) await syncLeagueState(false, { force: true });
    if (!overrides.silent) UI.adminActionStatus = kind === 'switch' ? 'Account team updated.' : 'Account unlinked.';
    UI.teamChangeDiscordId = '';
    UI.teamChangeTeam = '';
    if (!overrides.silent) await loadTeamAvailability();
  } catch (e) {
    UI.adminActionError = e.message || 'Admin action failed.';
    throw e;
  }
  if (!overrides.silent) render();
}

async function savePendingTeamChanges(){
  if (!hasPendingTeamChanges()) return;
  const pending = UI.teamPending || { unlinks: {}, switches: {}, roles: {} };
  UI.adminActionError = null;
  UI.adminActionStatus = 'Saving team changes...';
  render();
  try {
    const roleChanges = Object.keys(pending.roles || {}).map(function(key){ return pending.roles[key]; });
    for (let i = 0; i < roleChanges.length; i++){
      await runAdminAccessLevelChange(roleChanges[i].discordId, roleChanges[i].accessLevel, { silent: true });
    }
    const unlinkChanges = Object.keys(pending.unlinks || {}).map(function(key){ return pending.unlinks[key]; });
    for (let i = 0; i < unlinkChanges.length; i++){
      await runAdminAccountAction('unlink', { team: unlinkChanges[i].team, silent: true });
    }
    const switchChanges = Object.keys(pending.switches || {}).map(function(key){ return pending.switches[key]; });
    for (let i = 0; i < switchChanges.length; i++){
      await runAdminAccountAction('switch', { discordId: switchChanges[i].discordId, team: switchChanges[i].team, silent: true });
    }
    resetPendingTeamChanges();
    UI.adminActionStatus = 'Team changes saved.';
    await loadTeamAvailability();
  } catch (e) {
    UI.adminActionError = e.message || 'Could not save team changes.';
  }
  render();
}

// ---------- Visits ----------

function blankVisitState(){
  return { coach: false, campus: false, campusLabel: '' };
}

function normalizeVisits(visits){
  const out = blankVisitState();
  if (!visits) return out;
  out.coach = !!visits.coach;
  out.campus = !!(visits.campus || visits.school);
  out.campusLabel = (visits.campusLabel || visits.schoolLabel || '').trim();
  return out;
}

function detectVisits(text, aiVisits){
  const visits = normalizeVisits(aiVisits);
  const raw = text || '';
  if (/coach\s+visit/i.test(raw)) visits.coach = true;
  const campusMatch = raw.match(/(?:campus|school)\s+visit\s*([^\n\r]*)/i);
  if (campusMatch){
    visits.campus = true;
    visits.campusLabel = (campusMatch[1] || visits.campusLabel || '').replace(/\(\s*\d+\s*\/\s*17\s*\)/i, '').trim();
  }
  return visits;
}

function campusVisitPhrase(visits){
  visits = normalizeVisits(visits);
  return visits.campus ? 'Campus Visit' + (visits.campusLabel ? ' ' + visits.campusLabel : '') : '';
}

function titleCaseTeamName(name){
  return String(name || '').trim().split(/\s+/).map(function(part){
    if (/^[A-Z0-9&.-]{2,}$/.test(part)) return part;
    return part.split('-').map(function(piece){
      return piece ? piece.charAt(0).toUpperCase() + piece.slice(1).toLowerCase() : piece;
    }).join('-');
  }).join(' ');
}

function normalizeCampusVisitLabel(label){
  let raw = String(label || '').trim().replace(/\s+/g, ' ');
  raw = raw.replace(/^week\b/i, 'Week');
  raw = raw.replace(/\bvs\.?/i, 'vs.');
  raw = raw.replace(/\s+vs\.\s+/i, ' vs. ');
  const match = raw.match(/^Week\s+(\d{1,2})\s+vs\.\s+(.+)$/i);
  if (!match || !match[2].trim()) return { ok: false, value: raw };
  const opponent = match[2].trim();
  if (/^[A-Z]{3,4}$/.test(opponent)) return { ok: false, value: raw, reason: 'abbr' };
  return { ok: true, value: 'Week ' + parseInt(match[1], 10) + ' vs. ' + titleCaseTeamName(opponent) };
}

function syncCampusVisitText(text, visits){
  let out = String(text || '');
  const phrase = campusVisitPhrase(visits);
  const campusRe = /(?:Campus|School)\s+Visit[\s\S]*?(?=\s+(?:Campus|Prestige|Education|Playing Time|Tradition|Coach|Pro Potential):|\n|$)/i;
  if (campusRe.test(out)){
    out = phrase ? out.replace(campusRe, phrase) : out.replace(campusRe, '').replace(/[ \t]{2,}/g, ' ');
  } else if (phrase) {
    const heading = out.search(/\b(?:Campus|Prestige|Education|Playing Time|Tradition|Coach|Pro Potential):/);
    out = heading >= 0 ? out.slice(0, heading).trimEnd() + '\n' + phrase + '\n' + out.slice(heading) : out.trimEnd() + '\n' + phrase;
  }
  return out.trim();
}

function syncCoachVisitText(text, visits){
  let out = String(text || '');
  visits = normalizeVisits(visits);
  const coachRe = /Coach\s+Visit(?:\s*\(\s*\d+\s*\/\s*10\s*\))?/i;
  if (coachRe.test(out)){
    out = visits.coach ? out.replace(coachRe, 'Coach Visit') : out.replace(coachRe, '').replace(/[ \t]{2,}/g, ' ');
  } else if (visits.coach) {
    const heading = out.search(/\b(?:Campus|Prestige|Education|Playing Time|Tradition|Coach|Pro Potential):/);
    out = heading >= 0 ? out.slice(0, heading).trimEnd() + '\nCoach Visit\n' + out.slice(heading) : out.trimEnd() + '\nCoach Visit';
  }
  return out.trim();
}

function stripWrappingQuotes(text){
  let out = (text || '').trim();
  const pairs = [['"', '"'], ["'", "'"], ['“', '”'], ['‘', '’']];
  let changed = true;
  while (changed && out.length >= 2){
    changed = false;
    for (let i = 0; i < pairs.length; i++){
      const pair = pairs[i];
      if (out[0] === pair[0] && out[out.length - 1] === pair[1]){
        out = out.slice(1, -1).trim();
        changed = true;
      }
    }
  }
  return out;
}

function getTeamVisitUsage(){
  const usage = {};
  Object.keys(DB.teams || {}).forEach(function(team){
    usage[team] = { coach: 0, campus: 0 };
  });
  Object.keys(DB.offersByProspect || {}).forEach(function(pid){
    (DB.offersByProspect[pid] || []).forEach(function(o){
      if (!o || !o.team) return;
      if (!usage[o.team]) usage[o.team] = { coach: 0, campus: 0 };
      const visits = normalizeVisits(o.visits);
      if (visits.coach) usage[o.team].coach++;
      if (visits.campus) usage[o.team].campus++;
    });
  });
  return usage;
}

function visitLimitErrors(team, visits, existingOffer){
  const usage = getTeamVisitUsage();
  const current = usage[team] || { coach: 0, campus: 0 };
  const existingVisits = existingOffer ? normalizeVisits(existingOffer.visits) : blankVisitState();
  const errors = [];
  if (visits.coach && !existingVisits.coach && current.coach >= 10) errors.push('Offer denied: coach visit limit already reached (10/10).');
  if (visits.campus && !existingVisits.campus && current.campus >= 17) errors.push('Offer denied: campus visit limit already reached (17/17).');
  return errors;
}

function visitEditLocks(team, offer){
  const usage = getTeamVisitUsage()[team] || { coach: 0, campus: 0 };
  const visits = normalizeVisits(offer && offer.visits);
  return {
    coach: visits.coach || (!visits.coach && usage.coach >= 10),
    campus: visits.campus || (!visits.campus && usage.campus >= 17)
  };
}

function visitBadges(visits, compact){
  visits = normalizeVisits(visits);
  const margin = compact ? '0' : '0 6px 6px 0';
  const campusText = visits.campusLabel ? 'Campus Visit: ' + visits.campusLabel : 'Campus Visit';
  let html = '';
  if (visits.coach) html += '<span class="rb-tag rb-visit-badge rb-visit-badge-coach" style="display:inline-block;margin:' + margin + ';">Coach Visit</span>';
  if (visits.campus) html += '<span class="rb-tag rb-visit-badge rb-visit-badge-campus" style="display:inline-block;margin:' + margin + ';">' + formatVisitBadgeText(campusText) + '</span>';
  return html;
}

function formatVisitBadgeText(text){
  const escaped = escapeHtml(text || '');
  return escaped.replace(/\bvs\.?\s+([^<]+)$/i, function(_, opponent){
    return 'vs. <span style="white-space:nowrap;">' + opponent.replace(/\s+/g, '&nbsp;') + '</span>';
  });
}

function findOfferForTeam(prospectId, team){
  return (DB.offersByProspect[prospectId] || []).find(function(o){ return o.team === team && !o.rescinded; });
}

function findAnyOfferForTeam(prospectId, team){
  return (DB.offersByProspect[prospectId] || []).find(function(o){ return o.team === team; });
}

function offerType(offer){
  const text = String((offer && offer.text) || '').toLowerCase();
  if (/\bwalk\s*-?\s*on\b|\bwo\b/.test(text)) return 'walkon';
  return 'scholarship';
}

function prospectOverall(prospect){
  const match = String((prospect && prospect.rating) || '').match(/(\d+)/);
  return match ? Number(match[1]) : null;
}

function normalizeConditionalRules(){
  if (!Array.isArray(DB.conditionalRescinds)) DB.conditionalRescinds = [];
  return DB.conditionalRescinds;
}

function conditionalRuleMatchesProspect(rule, prospect, offer){
  if (!rule || !prospect) return false;
  const positions = Array.isArray(rule.positions) ? rule.positions.map(function(pos){ return String(pos || '').trim().toUpperCase(); }).filter(Boolean) : String(rule.position || '').split(',').map(function(pos){ return pos.trim().toUpperCase(); }).filter(Boolean);
  if (positions.length && positions.indexOf(String(prospect.position || '').trim().toUpperCase()) === -1) return false;
  if (rule.stars !== '' && rule.stars != null){
    const expectedStars = Number(rule.stars);
    if (Number.isFinite(expectedStars) && starsForRank(prospect.rank) !== expectedStars) return false;
  }
  const rankLimit = Number(rule.rankValue);
  if (Number.isFinite(rankLimit) && rankLimit > 0){
    if (rule.rankMode === 'better' && Number(prospect.rank) > rankLimit) return false;
    if (rule.rankMode === 'worse' && Number(prospect.rank) <= rankLimit) return false;
  }
  const overallLimit = Number(rule.overallValue);
  const overall = prospectOverall(prospect);
  if (Number.isFinite(overallLimit) && overallLimit > 0){
    if (overall == null) return false;
    if (rule.overallMode === 'below'){
      if (overall >= overallLimit) return false;
    } else if (overall < overallLimit) return false;
  }
  const scholarship = String(rule.scholarship || '').trim().toLowerCase();
  if (scholarship && (!offer || offerType(offer) !== scholarship)) return false;
  return true;
}

function applyConditionalRescinds(){
  const rules = normalizeConditionalRules();
  const results = [];
  rules.forEach(function(rule){
    if (!rule || !rule.enabled || !rule.team) return;
    const threshold = Math.max(1, Number(rule.count) || 0);
    const matchingCommits = Object.keys(DB.prospects || {}).filter(function(pid){
      const prospect = DB.prospects[pid];
      const winningOffer = (DB.offersByProspect[pid] || []).find(function(offer){ return offer && !offer.rescinded && teamKey(offer.team) === teamKey(rule.team); });
      return prospect && teamKey(prospect.commitTeam) === teamKey(rule.team) && conditionalRuleMatchesProspect(rule, prospect, winningOffer);
    });
    if (matchingCommits.length < threshold) return;
    let rescinded = 0;
    const prospectOnlyRule = Object.assign({}, rule, { scholarship: '' });
    Object.keys(DB.offersByProspect || {}).forEach(function(pid){
      const prospect = DB.prospects[pid];
      if (!prospect || prospect.commitTeam || !conditionalRuleMatchesProspect(prospectOnlyRule, prospect, null)) return;
      (DB.offersByProspect[pid] || []).forEach(function(offer){
        if (!offer || offer.rescinded || teamKey(offer.team) !== teamKey(rule.team)) return;
        if (!conditionalRuleMatchesProspect(rule, prospect, offer)) return;
        offer.rescinded = true;
        offer.text = 'rescinded';
        offer.promises = [];
        offer.rescindedAt = Date.now();
        offer.rescindReason = 'Conditional rescind: ' + (rule.name || 'rule met');
        offer.conditionalRescindRuleId = rule.id || '';
        rescinded++;
      });
    });
    if (rescinded){
      rule.lastTriggeredAt = Date.now();
      rule.lastMatchedCommitCount = matchingCommits.length;
      rule.lastRescindedCount = rescinded;
      results.push({ ruleId: rule.id || '', team: rule.team, rescinded: rescinded });
    }
  });
  return results;
}

function addOfferDirect(prospectId, team, coach, text, promises, visits){
  if (DB.offersLocked) return { ok: false, error: 'Offer denied: offers are locked.' };
  const prospect = DB.prospects[prospectId];
  if (prospect && prospect.commitTeam) return { ok: false, error: 'Offer denied: #' + prospect.rank + ' ' + prospect.name + ' has committed to ' + prospect.commitTeam + '.' };
  const priorOffer = findAnyOfferForTeam(prospectId, team);
  if (priorOffer){
    const status = priorOffer.rescinded ? 'already offered and rescinded' : 'already offered';
    return { ok: false, error: 'Offer denied: ' + team + ' has ' + status + ' #' + (prospect ? prospect.rank : prospectId.replace(/^r/, '')) + (prospect ? ' ' + prospect.name : '') + '.' };
  }
  visits = detectVisits(text, visits);
  if (visits.campus){
    const normalizedCampus = normalizeCampusVisitLabel(visits.campusLabel);
    if (!normalizedCampus.ok) return { ok: false, error: 'Offer denied: campus visit must use Week X vs. Team Name, no 3-4 letter all-caps abbreviations.' };
    visits.campusLabel = normalizedCampus.value;
  }
  const existingOffer = findOfferForTeam(prospectId, team);
  const errors = visitLimitErrors(team, visits, existingOffer);
  if (errors.length) return { ok: false, error: errors.join(' ') };
  if (!DB.offersByProspect[prospectId]) DB.offersByProspect[prospectId] = [];
  DB.offersByProspect[prospectId].push({
    id: uid('o'), team: team, coach: coach || '', text: text || '',
    promises: (promises || []).slice(0, 3).map(function(p){
      return { id: uid('pr'), text: p.text || '', title: p.title || p.category || 'other', category: p.category || p.title || 'other' };
    }),
    visits: visits,
    createdAt: Date.now()
  });
  return { ok: true };
}

function promiseCategory(text){
  const t = (text || '').toLowerCase();
  if (/play|snap|start|starter|role|touch|carry|target|minutes/.test(t)) return 'playing_time';
  if (/win|home game|bowl|playoff|championship|postseason|ranked/.test(t)) return 'wins_bowls';
  if (/develop|draft|nfl|award|all-american|heisman|improve/.test(t)) return 'development';
  if (/campus|facility|facilities|culture|tradition|environment|education|university|academic/.test(t)) return 'culture_facilities';
  return 'other';
}

function findPitchTitle(text, promiseStart){
  const before = (text || '').slice(0, promiseStart);
  const matches = before.match(/(?:^|\n)\s*([A-Za-z][A-Za-z &/-]{1,34}):/g);
  if (!matches || !matches.length) return null;
  return matches[matches.length - 1].replace(/^\s*/, '').replace(/:$/, '').trim();
}

function extractPromises(text){
  const promises = [];
  const seen = {};
  text = String(text || '');
  const addPromise = function(promise, start){
    promise = String(promise || '').replace(/\*\*/g, '').replace(/\s+/g, ' ').trim();
    if (!isLikelyPromiseText(promise) || seen[promise.toLowerCase()]) return;
    seen[promise.toLowerCase()] = true;
    const title = findPitchTitle(text, start) || promiseCategory(promise).replace(/_/g, ' ');
    promises.push({ text: promise, title: title, category: promiseCategory(promise) });
  };
  const re = /\*\*([\s\S]*?)\*\*/g;
  let match;
  while ((match = re.exec(text || ''))){
    addPromise(match[1], match.index);
  }
  const plainStartRe = /\b(?:I|we)\s+promise\b/gi;
  while ((match = plainStartRe.exec(text))){
    const start = match.index;
    const rest = text.slice(start);
    const nextHeaderMatch = rest.slice(1).match(/\n\s*[A-Za-z][A-Za-z &/-]{1,34}:\s*/);
    const nextHeader = nextHeaderMatch ? nextHeaderMatch.index + 1 : rest.length;
    const paragraphBreak = rest.search(/\n\s*\n/);
    const hardStop = paragraphBreak !== -1 ? Math.min(nextHeader, paragraphBreak) : nextHeader;
    let end = hardStop;
    const sentenceRe = /[.!?](?=\s|$)/g;
    let sentenceMatch;
    while ((sentenceMatch = sentenceRe.exec(rest))){
      if (sentenceMatch.index >= hardStop) break;
      end = sentenceMatch.index + 1;
      break;
    }
    addPromise(rest.slice(0, end), start);
  }
  return promises;
}

function isLikelyPromiseText(text){
  const out = String(text || '').replace(/\*\*/g, '').replace(/\s+/g, ' ').trim();
  return out.length >= 18 && /\b(?:i|we)\s+promise\b/i.test(out);
}

function sanitizePromiseText(text){
  let out = String(text || '').replace(/\*\*/g, '').replace(/\s+/g, ' ').trim();
  const nextSection = out.search(/\s[A-Z][A-Za-z &/-]{1,34}:\s/);
  if (nextSection > 0) out = out.slice(0, nextSection).trim();
  return out;
}

function cleanDisplayPromises(offer){
  const source = (offer && offer.promises && offer.promises.length) ? offer.promises : extractPromises((offer && offer.text) || '');
  const seen = {};
  const cleaned = [];
  (source || []).forEach(function(p){
    const text = sanitizePromiseText(p && p.text);
    const key = text.toLowerCase();
    if (!isLikelyPromiseText(text) || seen[key]) return;
    seen[key] = true;
    cleaned.push(Object.assign({}, p, { text: text }));
  });
  return cleaned;
}

function titleForPromise(offer, promise){
  if (promise.title && promise.title !== promise.category) return promise.title;
  const text = offer ? offer.text || '' : '';
  const promiseText = promise.text || '';
  const boldNeedle = '**' + promiseText + '**';
  let idx = text.indexOf(boldNeedle);
  if (idx === -1) idx = text.indexOf(promiseText);
  if (idx !== -1){
    const title = findPitchTitle(text, idx);
    if (title) return title;
  }
  if (promise.title) return promise.title;
  if (promise.category) return String(promise.category).replace(/_/g, ' ');
  return 'Promise';
}

function buildPromiseArchive(){
  const rows = Object.keys(DB.prospects || {}).map(function(pid){ return DB.prospects[pid]; }).filter(function(p){
    return p && p.commitTeam;
  }).sort(function(a,b){ return a.rank - b.rank; }).map(function(p){
    const winningOffers = (DB.offersByProspect[p.id] || []).filter(function(o){
      return !o.rescinded && o.team && teamKey(o.team) === teamKey(p.commitTeam);
    });
    const promises = [];
    winningOffers.forEach(function(o){
      cleanDisplayPromises(o).forEach(function(pr){
        promises.push({
          category: String(titleForPromise(o, pr)).replace(/_/g, ' '),
          promise: pr.text
        });
      });
    });
    return {
      rank: p.rank,
      name: p.name,
      position: p.position,
      rating: p.rating,
      hometown: p.hometown,
      committedTeam: p.commitTeam,
      promises: promises
    };
  }).filter(function(row){ return row.promises.length; });

  return {
    exportedAt: new Date().toISOString(),
    className: UI.classFileName || DEFAULT_CLASS_NAME,
    commitSheetUrl: DB.commitSheetUrl || '',
    commitsWithPromises: rows.length,
    commits: rows
  };
}

function exportPromiseArchive(){
  const data = buildPromiseArchive();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'nzcfl-promise-archive-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function visitSummary(visits){
  visits = normalizeVisits(visits);
  const parts = [];
  if (visits.coach) parts.push('coach');
  if (visits.campus) parts.push('campus' + (visits.campusLabel ? ': ' + visits.campusLabel : ''));
  return parts.length ? parts.join(' + ') : 'none';
}

function visitChangeLine(kind, oldVisits, newVisits){
  oldVisits = normalizeVisits(oldVisits);
  newVisits = normalizeVisits(newVisits);
  if (kind === 'coach'){
    if (!oldVisits.coach && newVisits.coach) return 'Added coach visit';
    if (oldVisits.coach && !newVisits.coach) return 'Removed coach visit';
    return '';
  }
  if (!oldVisits.campus && newVisits.campus){
    return 'Added campus visit' + (newVisits.campusLabel ? ': ' + newVisits.campusLabel : '');
  }
  if (oldVisits.campus && !newVisits.campus) return 'Removed campus visit';
  if (oldVisits.campusLabel !== newVisits.campusLabel){
    return 'Updated campus visit: ' + (oldVisits.campusLabel || 'no label') + ' -> ' + (newVisits.campusLabel || 'no label');
  }
  return '';
}

function findOfferById(prospectId, offerId){
  const offer = (DB.offersByProspect[prospectId] || []).find(function(o){ return o.id === offerId; });
  return offer || null;
}

function openEditOffer(prospectId, offerId){
  UI.editOfferTarget = { prospectId: prospectId, offerId: offerId };

}

function closeEditOffer(){
  UI.editOfferTarget = null;

function saveOfferEdit(form, confirmedVisits){
  confirmedVisits = confirmedVisits || {};
  if (!SESSION || !UI.editOfferTarget) return;
  const prospectId = UI.editOfferTarget.prospectId;
  const offerId = UI.editOfferTarget.offerId;
  const prospect = DB.prospects[prospectId];
  const offer = findOfferById(prospectId, offerId);
  if (!offer || offer.team !== SESSION.team || offer.rescinded || (prospect && prospect.commitTeam)){
    UI.editError = 'That offer is no longer editable.';
    render(); return;
  }
  const oldVisits = normalizeVisits(offer.visits);
  const newVisits = normalizeVisits(offer.visits);
  newVisits.coach = oldVisits.coach || !!(form && form.coach);
  newVisits.campus = oldVisits.campus || !!(form && form.campus);
  if (newVisits.campus){
    const normalizedCampus = normalizeCampusVisitLabel((form && form.campusLabel) || oldVisits.campusLabel);
    if (!normalizedCampus.ok){
      UI.editError = normalizedCampus.reason === 'abbr' ? 'Use the full team name, not a 3-4 letter all-caps abbreviation.' : 'Campus visit must use: Week X vs. Team Name';
      render(); return;
    }
    newVisits.campusLabel = normalizedCampus.value;
  } else {
    newVisits.campusLabel = '';
  }
  const errors = visitLimitErrors(offer.team, newVisits, offer);
  if (errors.length){
    UI.editError = errors.join(' ');
    render(); return;
  }
  const addingCoach = !oldVisits.coach && newVisits.coach;
  const addingCampus = !oldVisits.campus && newVisits.campus;
  if ((addingCoach && !confirmedVisits.coach) || (addingCampus && !confirmedVisits.campus)){
    UI.pendingVisitEdit = { form: Object.assign({}, form, { campusLabel: newVisits.campusLabel }), coach: addingCoach, campus: addingCampus };
    UI.editError = null;
    render(); return;
  }
  let nextText = offer.text || '';
  nextText = syncCampusVisitText(nextText, newVisits);
  nextText = syncCoachVisitText(nextText, newVisits);
  const changes = [];
  if (oldVisits.coach !== newVisits.coach) changes.push(visitChangeLine('coach', oldVisits, newVisits));
  if (oldVisits.campus !== newVisits.campus || oldVisits.campusLabel !== newVisits.campusLabel){
    changes.push(visitChangeLine('campus', oldVisits, newVisits));
  }
  const cleanChanges = changes.filter(Boolean);
  if (!cleanChanges.length){
    closeEditOffer();
    return;
  }
  offer.editHistory = offer.editHistory || [];
  offer.editHistory.push({ id: uid('eh'), editedAt: Date.now(), editor: SESSION.team, changes: cleanChanges.slice(0, 8) });
  if (offer.editHistory.length > 20) offer.editHistory = offer.editHistory.slice(-20);
  offer.text = nextText;
  offer.visits = newVisits;
  UI.editOfferTarget = null;
  UI.editError = null;
  saveDB(); render();
}

function findProspectFromOffer(text){
  const raw = text || '';
  const offerRank = raw.match(/\boffer\s+#\s*(\d+)\b/i);
  const rank = offerRank ? parseInt(offerRank[1], 10) : null;
  if (rank && DB.prospects['r' + rank]) return DB.prospects['r' + rank];

  const exactMatches = Object.keys(DB.prospects).map(function(id){ return DB.prospects[id]; }).filter(function(p){
    return p.name && raw.toLowerCase().indexOf(p.name.toLowerCase()) !== -1;
  });
  if (exactMatches.length === 1) return exactMatches[0];

  const genericRank = raw.match(/#\s*(\d+)\b/);
  const fallbackRank = genericRank ? parseInt(genericRank[1], 10) : null;
  if (fallbackRank && DB.prospects['r' + fallbackRank]) return DB.prospects['r' + fallbackRank];
  return null;
}

function parseOfferSheet(rawText){
  const text = stripWrappingQuotes(rawText);
  if (!text) return null;
  const prospect = findProspectFromOffer(text);
  return {
    rank: prospect ? prospect.rank : null,
    offerText: text,
    visits: detectVisits(text, null),
    promises: extractPromises(text)
  };
}

async function submitOfferSheet(rawText){
  if (!SESSION || !rawText.trim()) return;
  if (DB.offersLocked){
    UI.lastSummary = { errorText: 'Offer denied: offers are locked.' };
    UI.showSubmitModal = false;
    UI.submitTargetId = null;
    render(); return;
  }
  UI.submitting = true; render();
  try {
    const parsed = parseOfferSheet(rawText);
    let matched = 0, unmatched = 0, limitError = null;
    if (parsed){
      const item = parsed;
      const visits = detectVisits(item.offerText || rawText, item.visits);
      const pid = UI.submitTargetId || (item.rank ? 'r' + item.rank : null);
      if (pid && DB.prospects[pid]){
        const result = addOfferDirect(pid, SESSION.team, (DB.teams[SESSION.team] || {}).coach, item.offerText, item.promises, visits);
        if (result.ok) matched++; else limitError = result.error;
      } else {
        DB.unmatched.push({ id: uid('u'), team: SESSION.team, coach: (DB.teams[SESSION.team] || {}).coach,
          offerText: item.offerText || rawText, promises: item.promises || [], visits: visits, createdAt: Date.now() });
        unmatched++;
      }
    }
    UI.lastSummary = limitError ? { errorText: limitError } : { matched: matched, unmatched: unmatched, total: parsed ? 1 : 0, dismissAt: Date.now() + 6000 };
  } catch (e) {
    UI.lastSummary = { error: true };
  }
  UI.submitting = false;
  UI.showSubmitModal = false;
  UI.submitTargetId = null;
  await saveDBNow(); render();
}

function assignUnmatched(id, rankValue){
  const rank = parseInt(rankValue, 10);
  const item = DB.unmatched.find(function(u){ return u.id === id; });
  if (!item) return;
  const pid = 'r' + rank;
  if (!rank || !DB.prospects[pid]){
    UI.assignError[id] = 'No open prospect with rank #' + rankValue + '.';
    render(); return;
  }
  const result = addOfferDirect(pid, item.team, item.coach, item.offerText, item.promises, item.visits);
  if (!result.ok){
    UI.assignError[id] = result.error;
    render(); return;
  }
  DB.unmatched = DB.unmatched.filter(function(u){ return u.id !== id; });
  delete UI.assignError[id];
  saveDB(); render();
}

function activeDangerApproval(kind){
  const entry = (DB.dangerApprovals || {})[kind] || null;
  if (!entry || !entry.requestedAt) return null;
  if (Date.now() - entry.requestedAt > 24 * 60 * 60 * 1000) return null;
  return entry;
}

function dangerApprovalList(kind){
  const entry = activeDangerApproval(kind);
  return entry && entry.approvals ? Object.keys(entry.approvals).map(function(id){ return Object.assign({ discordId: id }, entry.approvals[id]); }) : [];

async function approveDangerReset(){

  const kind = UI.confirmReset;
  DB.dangerApprovals = DB.dangerApprovals || {};
  const current = activeDangerApproval(kind) || { kind: kind, requestedAt: Date.now(), approvals: {} };
  current.approvals = current.approvals || {};
  current.approvals[SESSION.discordId || SESSION.team || uid('commissioner')] = {
    name: SESSION.username || SESSION.team || 'Commissioner',
    team: SESSION.team || '',
    approvedAt: Date.now()
  };

  const approvals = Object.keys(current.approvals);

async function confirmReset(){
  if (UI.confirmReset === 'offers'){
    DB.offersByProspect = {};
    DB.unmatched = [];
    DB.conditionalRescinds = [];
    DB.commitSheetUrl = DEFAULT_COMMIT_SHEET_URL;

    UI.assignError = {};
  } else if (UI.confirmReset === 'class'){
    DB.fullRoster = [];
    DB.released = {};
    DB.wave1Released = false;
    DB.wave2Released = false;
    DB.prospects = {};
    DB.threads = [];
    DB.offersByProspect = {};
    DB.unmatched = [];
    DB.conditionalRescinds = [];
    DB.defaultClassLoaded = false;
    applyDefaultClassData(window.NZCFL_DEFAULT_CLASS_CSV || '');

    UI.view = 'setup';
    UI.classFileName = '';
    UI.classError = null;

    UI.rescindError = null;

  }
  if (DB.dangerApprovals) delete DB.dangerApprovals[UI.confirmReset];
  UI.confirmReset = null;
  await saveDBNow(); render();
}

function render(){
  const root = document.getElementById('rb-app');
  if (!dbReady || !sessionReady){
    root.innerHTML = '<p class="rb-mono" style="color:var(--slate)">Loading league data...</p>' + renderBackTopControl();
    bindEvents();
    return;
  }
  if (!SESSION){
    root.innerHTML = renderHomePage() + renderBackTopControl();
    bindEvents();
    return;
  }
  let html = renderNav();
  if (UI.lastSummary) html += renderSummaryBanner();
  if (DB.unmatched.length) html += renderUnmatchedReview();
  if (UI.view === 'feed') html += renderFeed();
  else if (UI.view === 'setup') html += canViewSettings() ? renderClassSetup() : renderAccessDenied();
  else if (UI.view === 'thread') html += renderThread();
  else if (UI.view === 'prospect') html += renderProspectDetail();
  else if (UI.view === 'myoffers') html += renderMyOffers();
  else if (UI.view === 'mycommits') html += renderMyCommits();
  else if (UI.view === 'teams') html += renderTeamsPage();
  else if (UI.view === 'teamcommits') html += renderTeamCommits();
  else if (UI.view === 'teamoffers') html += renderTeamOffers();
  if (UI.showSubmitModal) html += renderSubmitModal();
  if (UI.editOfferTarget) html += renderEditOfferModal();
  if (UI.pendingVisitEdit) html += renderVisitConfirmModal();
  if (UI.pendingMassRescind) html += renderMassRescindModal();
  if (UI.pendingMassRescindFinal) html += renderMassRescindFinalModal();
  if (UI.pendingSingleRescind) html += renderSingleRescindConfirmModal();
  if (UI.teamAdminModal) html += renderTeamAdminModal();
  if (UI.confirmReset) html += renderResetConfirmModal();
  html += renderBackTopControl();
  root.innerHTML = html;
  bindEvents();
  scheduleSummaryCountdown();
}

function scheduleSummaryCountdown(){
  if (summaryTimer) {
    clearTimeout(summaryTimer);
    summaryTimer = null;
  }
  if (!UI.lastSummary || !UI.lastSummary.dismissAt) return;
  const ms = UI.lastSummary.dismissAt - Date.now();
  if (ms <= 0){
    UI.lastSummary = null;
    render();
    return;
  }
  summaryTimer = setTimeout(function(){
    if (!UI.lastSummary || !UI.lastSummary.dismissAt) return;
    if (Date.now() >= UI.lastSummary.dismissAt) UI.lastSummary = null;
    render();
  }, Math.min(1000, ms));
}

const POSITION_ORDER = ['QB','RB','WR','TE','OL','DL','LB','CB','S','K','P'];

function availablePositions(){
  const positions = {};
  Object.keys(DB.prospects || {}).forEach(function(pid){
    const pos = String((DB.prospects[pid] && DB.prospects[pid].position) || '').trim().toUpperCase();
    if (pos) positions[pos] = true;
  });
  const ordered = POSITION_ORDER.filter(function(pos){ return positions[pos]; });
  Object.keys(positions).sort().forEach(function(pos){
    if (ordered.indexOf(pos) === -1) ordered.push(pos);
  });
  return ordered;
}

function renderPositionChecklist(prefix){
  const positions = availablePositions();

  html += '<div class="rb-card" style="padding:8px;background:var(--ink);display:flex;gap:6px;flex-wrap:wrap;">';
  positions.forEach(function(pos){

    html += '<input type="checkbox" class="rb-position-check" data-position-prefix="' + escapeHtml(prefix) + '" value="' + escapeHtml(pos) + '" style="accent-color:var(--gold);" /> ' + escapeHtml(pos);
    html += '</label>';
  });
  html += '</div></div>';
  return html;
}

function readPositionChecklist(prefix){
  const positions = [];
  document.querySelectorAll('.rb-position-check[data-position-prefix="' + prefix + '"]:checked').forEach(function(input){
    const pos = String(input.value || '').trim().toUpperCase();
    if (pos && positions.indexOf(pos) === -1) positions.push(pos);
  });
  return positions;
}

function conditionalRuleSummary(rule){
  const parts = [];
  parts.push(Number(rule.count || 1) + ' commit' + (Number(rule.count || 1) === 1 ? '' : 's'));
  const positions = Array.isArray(rule.positions) ? rule.positions : (rule.position ? String(rule.position).split(',') : []);
  const cleanPositions = positions.map(function(pos){ return String(pos || '').trim().toUpperCase(); }).filter(Boolean);
  if (cleanPositions.length) parts.push(cleanPositions.join('/'));
  if (rule.stars !== '' && rule.stars != null) parts.push(rule.stars + ' star' + (Number(rule.stars) === 1 ? '' : 's'));
  if (rule.rankValue) parts.push((rule.rankMode === 'better' ? '#' + rule.rankValue + ' or better' : 'below #' + rule.rankValue));
  if (rule.overallValue) parts.push((rule.overallMode === 'below' ? 'ovr below ' : 'ovr at least ') + rule.overallValue);
  if (rule.scholarship) parts.push(rule.scholarship === 'walkon' ? 'walk-on' : 'scholarship');
  return parts.join(' · ');
}

function rescindFilterSummary(rule){
  const clone = Object.assign({ count: 1 }, rule || {});
  return conditionalRuleSummary(clone).replace(/^1 commit(?: · )?/, '') || 'all active offers';
}

function conditionalFormValue(id){
  const el = document.getElementById(id);
  return el ? String(el.value || '').trim() : '';
}

function readRescindRuleForm(prefix, includeCount){
  const rankValue = conditionalFormValue(prefix + '-rank-value');
  const overallValue = conditionalFormValue(prefix + '-overall-value');
  return {
    count: includeCount ? Math.max(1, Number(conditionalFormValue(prefix + '-count')) || 1) : 1,
    positions: readPositionChecklist(prefix),
    stars: conditionalFormValue(prefix + '-stars'),
    rankMode: rankValue ? (conditionalFormValue(prefix + '-rank-mode') || 'worse') : '',
    rankValue: rankValue,
    overallMode: overallValue ? (conditionalFormValue(prefix + '-overall-mode') || 'atLeast') : '',
    overallValue: overallValue,
    scholarship: conditionalFormValue(prefix + '-scholarship')
  };
}

function validateRescindRuleDraft(draft, options){
  options = options || {};
  const hasRank = draft.rankMode && draft.rankValue;
  const hasOverall = draft.overallMode && draft.overallValue;
  if (!(draft.positions || []).length && draft.stars === '' && !hasRank && !hasOverall && !draft.scholarship){
    return options.actionLabel ? 'Pick at least one filter before ' + options.actionLabel + '.' : 'Pick at least one filter.';
  }
  return '';
}

function normalizeRescindRuleDraft(draft){
  return {
    count: Math.max(1, Number(draft.count) || 1),
    positions: (draft.positions || []).map(function(pos){ return String(pos || '').trim().toUpperCase(); }).filter(Boolean),
    position: '',
    stars: draft.stars,
    rankMode: draft.rankMode,
    rankValue: draft.rankMode && draft.rankValue ? Number(draft.rankValue) : '',
    overallMode: draft.overallMode || 'atLeast',
    overallValue: draft.overallMode && draft.overallValue ? Number(draft.overallValue) : '',
    scholarship: draft.scholarship
  };
}

function addConditionalRule(){
  if (!SESSION) return;
  const draft = readRescindRuleForm('rb-cond', true);
  const error = validateRescindRuleDraft(draft, { actionLabel: 'saving a conditional rescind' });
  if (error){
    UI.conditionalError = error;
    UI.conditionalStatus = null;
    render(); return;
  }
  const normalized = normalizeRescindRuleDraft(draft);
  const rule = {
    id: uid('cr'),
    team: SESSION.team,
    enabled: true,
    count: normalized.count,
    positions: normalized.positions,
    position: '',
    stars: normalized.stars,
    rankMode: normalized.rankMode,
    rankValue: normalized.rankValue,
    overallMode: normalized.overallMode,
    overallValue: normalized.overallValue,
    scholarship: normalized.scholarship,
    createdAt: Date.now()
  };
  rule.name = conditionalRuleSummary(rule);
  normalizeConditionalRules().push(rule);
  const results = applyConditionalRescinds();
  UI.conditionalError = null;
  UI.conditionalStatus = 'Rule added' + (results.length ? ' and applied immediately.' : '.');
  saveDB(); render();
}

function massRescindMatches(rule){
  const rows = [];
  const prospectOnlyRule = Object.assign({}, rule, { scholarship: '' });
  Object.keys(DB.offersByProspect || {}).forEach(function(pid){
    const prospect = DB.prospects[pid];
    if (!prospect || prospect.commitTeam || !conditionalRuleMatchesProspect(prospectOnlyRule, prospect, null)) return;
    (DB.offersByProspect[pid] || []).forEach(function(offer){
      if (!offer || offer.rescinded || teamKey(offer.team) !== teamKey(SESSION.team)) return;
      if (!conditionalRuleMatchesProspect(rule, prospect, offer)) return;
      rows.push({ prospectId: pid, prospect: prospect, offer: offer });
    });
  });
  return rows;
}

function previewMassRescind(){
  if (!SESSION) return;
  const draft = readRescindRuleForm('rb-mass', false);
  const error = validateRescindRuleDraft(draft, { actionLabel: 'previewing a mass rescind' });
  if (error){
    UI.massRescindError = error;
    UI.massRescindStatus = null;
    UI.pendingMassRescind = null;
    render(); return;
  }
  const rule = Object.assign(normalizeRescindRuleDraft(draft), { team: SESSION.team });
  const matches = massRescindMatches(rule);

  UI.massRescindError = null;
  UI.massRescindStatus = null;
  render();
}

function confirmMassRescind(){
  if (!SESSION || !UI.pendingMassRescindFinal) return;
  const rule = UI.pendingMassRescindFinal.rule;
  const matches = massRescindMatches(rule);
  const checked = {};
  (UI.pendingMassRescindFinal.selectedKeys || []).forEach(function(key){
    checked[key] = true;
  });
  let count = 0;
  matches.forEach(function(row){
    if (!checked[row.prospectId + ':' + row.offer.id]) return;
    row.offer.rescinded = true;
    row.offer.text = 'rescinded';
    row.offer.promises = [];
    row.offer.rescindedAt = Date.now();
    row.offer.rescindReason = 'Mass rescind: ' + rescindFilterSummary(rule);
    count++;
  });
  UI.massRescindStatus = 'Rescinded ' + count + ' offer' + (count === 1 ? '' : 's') + '.';
  UI.massRescindError = null;
  UI.pendingMassRescind = null;
  UI.pendingMassRescindFinal = null;
  saveDB(); render();
}

function getOfferRowsForTeam(team){
  const rows = [];

      if (o.team === team) rows.push({ prospect: p, prospectId: pid, offer: o });

  });
  rows.sort(function(a,b){
    const ar = a.prospect ? a.prospect.rank : 99999;
    const br = b.prospect ? b.prospect.rank : 99999;
    return ar - br;
  });
  return rows;
}

function positionBucket(position){
  const positionGroups = {
    HB: 'RB',
    FB: 'RB',
    OT: 'OL',
    OG: 'OL',
    C: 'OL',
    DE: 'DL',
    DT: 'DL',
    OLB: 'LB',
    MLB: 'LB',
    ILB: 'LB',
    FS: 'S',
    SS: 'S'
  };
  const rawPos = String(position || '').trim().toUpperCase();
  return positionGroups[rawPos] || rawPos;
}

function positionFilterKey(kind, team){
  return kind + ':' + teamKey(team || '');
}

function hiddenPositionBuckets(filterKey){
  return (UI.positionFilters && UI.positionFilters[filterKey]) || {};
}

function renderPositionCounts(items, getPosition, filterKey){
  const order = ['QB','RB','WR','TE','OL','DL','LB','CB','S','K','P'];
  const counts = {};
  (items || []).forEach(function(item){
    const pos = positionBucket(getPosition(item));
    if (!pos) return;
    counts[pos] = (counts[pos] || 0) + 1;
  });
  const hidden = hiddenPositionBuckets(filterKey);
  const positions = Object.keys(counts).sort(function(a,b){
    const ai = order.indexOf(a);
    const bi = order.indexOf(b);
    if (ai !== -1 || bi !== -1) return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
    return a.localeCompare(b);
  });
  if (!positions.length) return '';
  return '<div class="rb-position-counts" aria-label="Position counts">' +
    positions.map(function(pos){
    const muted = !!hidden[pos];
    return '<button type="button" class="rb-position-count' + (muted ? ' rb-position-count-muted' : '') + '" data-position-filter="' + escapeHtml(filterKey) + '" data-position-bucket="' + escapeHtml(pos) + '" aria-pressed="' + (muted ? 'true' : 'false') + '"><strong>' + escapeHtml(pos) + '</strong><span>' + counts[pos] + '</span></button>';
  }).join('') +
    '<span class="rb-position-count-actions">' +
      '<button type="button" class="rb-position-count rb-position-count-action" data-position-set="' + escapeHtml(filterKey) + '" data-position-set-mode="all">Select all</button>' +
      '<button type="button" class="rb-position-count rb-position-count-action" data-position-set="' + escapeHtml(filterKey) + '" data-position-set-mode="none">Select none</button>' +
    '</span>' +
  '</div>';
}

      if (pendingRole) html += '<span class="rb-mono rb-mobile-admin-control" style="font-size:11px;color:var(--gold);">pending access</span>';

        html += '<button class="rb-btn rb-btn-danger rb-mobile-admin-control" data-admin-unlink-team="' + escapeHtml(brand.region) + '">Remove</button>';
        html += '<button class="rb-btn rb-btn-gold rb-mobile-admin-control" data-admin-change-team="' + escapeHtml(link.discordId) + '">Change team</button>';

        ['coach','moderator','commissioner'].forEach(function(option){
          html += '<option value="' + option + '"' + (level === option ? ' selected' : '') + '>' + option.charAt(0).toUpperCase() + option.slice(1) + '</option>';
        });
        html += '</select>';
      }
    } else {
      html += '<span class="rb-mono" style="font-size:12px;color:var(--slate);">No Discord linked</span>';
    }
    html += '</div></div>';
    html += '</div>';
  });
  if (!visible.length) html += '<div class="rb-card" style="padding:28px;text-align:center;color:var(--slate);">No teams match that search.</div>';
  html += '<datalist id="rb-team-change-options">';

  html += '</datalist>';

    html += '<div class="rb-mobile-admin-control" style="display:flex;justify-content:center;margin-top:12px;position:sticky;bottom:12px;z-index:3;">';
    html += '<div class="rb-card" style="padding:8px 10px;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;width:auto;max-width:max-content;">';

    html += '<button class="rb-btn rb-btn-gold" id="rb-save-team-changes" ' + (!pendingCount ? 'disabled' : '') + '>Save changes</button>';
    html += '</div></div>';
